[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "data-qd-192"
version = "0.1.0"
description = "线性与环状序列切分"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sequence-digest = "sequence_digest.cli:main"
sequence-digest-lineage = "sequence_digest.lineage_cli:main"
sequence-digest-holdout = "sequence_digest.holdout_cli:main"
sequence-digest-ledger = "sequence_digest.ledger_cli:main"
sequence-digest-staff = "sequence_digest.staff_cli:main"
sequence-digest-sla = "sequence_digest.sla_cli:main"
sequence-digest-release-check = "sequence_digest.release_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
